# dsh-plugin-manager bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: installing through
# the official CLI —
#
#   dsh plugin --profile <name> add github:big-lixin/dsh-plugin-manager
#
# — reconciles `dsh.profile.bundles` against installed packages and, seeing
# this declaration, appends the package to the bundle stack. The profile boot
# then merges THIS patch (a single `insert` of the plugin row); no profile
# file edits needed. The bundle stack is composed at boot, so a CLI install
# mounts on the NEXT dsh restart.
#
# If the profile still carries a manual mount row for this plugin in its own
# cordis.patch.yml, remove it before switching to the bundle channel to avoid
# double-mounting.
- insert:
    - id: plugin-manager
      name: 'dsh-plugin-manager'
